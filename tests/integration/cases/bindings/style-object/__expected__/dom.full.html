<div class="usage-meter">
  <p style="color: rgb(20, 83, 45); font-weight: 700; line-height: 1.5; margin-bottom: 4px;">
    "Bandwidth: 100%"
  </p>
  <div aria-label="Bandwidth" aria-valuemax="100" aria-valuemin="0" aria-valuenow="100" role="progressbar" style="--meter-colour: #14532d; --meter-value: 100; border-color: rgb(20, 83, 45); border-style: solid; border-width: 1px; height: 12px; width: 200px;">
    <div style="background-color: var(--meter-colour); height: 100%; width: 100%;"></div>
  </div>
</div>
