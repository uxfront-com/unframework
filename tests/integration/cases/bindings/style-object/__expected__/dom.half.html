<div class="usage-meter">
  <p style="color: rgb(31, 77, 122); font-weight: 700; line-height: 1.5; margin-bottom: 4px;">
    "Storage: 50%"
  </p>
  <div aria-label="Storage" aria-valuemax="100" aria-valuemin="0" aria-valuenow="50" role="progressbar" style="--meter-colour: #1f4d7a; --meter-value: 50; border-color: rgb(31, 77, 122); border-style: solid; border-width: 2px; height: 12px; width: 200px;">
    <div style="background-color: var(--meter-colour); height: 100%; width: 50%;"></div>
  </div>
</div>
