<section aria-label="Filters" class="filter-panel" data-category="lighting" data-layout="stacked">
  <button aria-describedby="filter-panel-hint" aria-expanded="false" type="button">
    "Price filters"
  </button>
  <p id="filter-panel-hint">
    "Narrow the results by price."
  </p>
  <details>
    <summary>
      "Price range"
    </summary>
    <label>
      "Minimum price"
      <input name="min-price" type="number">
    </label>
  </details>
  <button aria-pressed="false" type="button">
    "In stock only"
  </button>
  <nav aria-label="Filter steps">
    <a aria-current="page" href="#filters">
      "Filters"
    </a>
  </nav>
  <p aria-busy="false" aria-live="polite" role="status">
    "Results ready"
  </p>
</section>
