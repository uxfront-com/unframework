<section aria-label="Filters" class="filter-panel" data-category="seating" data-layout="stacked">
  <button aria-describedby="filter-panel-hint" aria-expanded="true" type="button">
    "Price filters"
  </button>
  <p id="filter-panel-hint">
    "Prices include tax."
  </p>
  <details open="">
    <summary>
      "Price range"
    </summary>
    <label>
      "Minimum price"
      <input aria-invalid="true" disabled="" name="min-price" required="" type="number" uf:value="">
    </label>
  </details>
  <button aria-pressed="true" disabled="" type="button">
    "In stock only"
  </button>
  <nav aria-label="Filter steps">
    <a aria-current="step" href="#filters">
      "Filters"
    </a>
  </nav>
  <p aria-busy="true" aria-live="polite" role="status">
    "Loading results"
  </p>
</section>
