<section aria-label="Delivery">
  <fieldset>
    <legend>
      "Speed"
    </legend>
    <label>
      <input name="speed" type="radio" value="standard">
      " standard"
    </label>
    <label>
      <input checked="" name="speed" type="radio" value="express">
      " express"
    </label>
  </fieldset>
  <fieldset>
    <legend>
      "Extras"
    </legend>
    <label>
      <input checked="" type="checkbox" value="insurance">
      " insurance"
    </label>
    <label>
      <input type="checkbox" value="gift-wrap">
      " gift-wrap"
    </label>
  </fieldset>
  <output>
    "Speed: express, extras: insurance"
  </output>
</section>
