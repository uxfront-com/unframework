<section aria-label="Delivery">
  <fieldset>
    <legend>
      "Speed"
    </legend>
    <label>
      <input name="speed" type="radio" uf:checked="true" value="standard">
      " standard"
    </label>
    <label>
      <input name="speed" type="radio" uf:checked="false" value="express">
      " express"
    </label>
  </fieldset>
  <fieldset>
    <legend>
      "Extras"
    </legend>
    <label>
      <input type="checkbox" uf:checked="true" uf:indeterminate="false" value="insurance">
      " insurance"
    </label>
    <label>
      <input type="checkbox" uf:checked="true" uf:focused="" uf:indeterminate="false" value="gift-wrap">
      " gift-wrap"
    </label>
  </fieldset>
  <output>
    "Speed: standard, extras: insurance, gift-wrap"
  </output>
</section>
