<form aria-label="Sign up" class="signup-form">
  <label>
    "Name"
    <input name="name" uf:value="">
  </label>
  <label>
    "Email"
    <input name="email" type="email" uf:value="ada@example.com">
  </label>
  <label>
    "Plan"
    <select name="plan" uf:focused="">
      <option uf:selected="true" value="free">
        "Free"
      </option>
      <option uf:selected="false" value="pro">
        "Pro"
      </option>
    </select>
  </label>
  <label>
    <input name="newsletter" type="checkbox" uf:checked="false" uf:indeterminate="false">
    "Send me the newsletter"
  </label>
  <p role="status">
    "Name: ; email: ada@example.com; plan: free; newsletter: no; focus: none"
  </p>
  <button type="submit">
    "Sign up"
  </button>
</form>
