<form aria-label="Sign up" class="signup-form">
  <label>
    "Name"
    <input name="name" uf:value="">
  </label>
  <label>
    "Email"
    <input name="email" type="email" uf:value="">
  </label>
  <label>
    "Plan"
    <select name="plan">
      <option uf:selected="false" value="free">
        "Free"
      </option>
      <option uf:selected="true" value="pro">
        "Pro"
      </option>
    </select>
  </label>
  <label>
    <input name="newsletter" type="checkbox" uf:checked="true" uf:indeterminate="false">
    "Send me the newsletter"
  </label>
  <p role="status">
    "Name: ; email: ; plan: pro; newsletter: yes; focus: none"
  </p>
  <button type="submit" uf:focused="">
    "Sign up"
  </button>
</form>
