<form aria-label="Sign up" class="signup-form">
  <label>
    "Name"
    <input name="name">
  </label>
  <label>
    "Email"
    <input name="email" type="email">
  </label>
  <label>
    "Plan"
    <select name="plan">
      <option value="free">
        "Free"
      </option>
      <option value="pro">
        "Pro"
      </option>
    </select>
  </label>
  <label>
    <input name="newsletter" type="checkbox">
    "Send me the newsletter"
  </label>
  <p role="status">
    "Name: ; email: ; plan: free; newsletter: no; focus: none"
  </p>
  <button type="submit">
    "Sign up"
  </button>
</form>
