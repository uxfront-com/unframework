<section aria-label="Note" class="note-editor">
  <button type="button">
    "Save"
  </button>
  <label>
    "Title"
    <input name="title">
  </label>
  <label>
    "Body"
    <textarea name="body"></textarea>
  </label>
  <p role="status">
    "Saved 0 times, last key none"
  </p>
  <button type="button">
    "Save and close"
  </button>
  <label>
    "Tag"
    <input name="tag">
  </label>
  <button type="button">
    "Add tag"
  </button>
  <p>
    "Tags:"
  </p>
</section>
