<section aria-label="Composer" class="comment-composer">
  <label>
    "Comment"
    <textarea name="comment" uf:value=""></textarea>
  </label>
  <form aria-label="Tags">
    <label>
      "Tag"
      <input name="tag" uf:value="">
    </label>
    <button type="submit">
      "Save tags"
    </button>
  </form>
  <ul aria-label="Tag list"></ul>
  <label>
    "Code"
    <input name="code" uf:value="">
  </label>
  <div class="panel" role="presentation">
    <label>
      "Search"
      <input name="search" uf:value="">
    </label>
    <p>
      "Searching for:"
    </p>
  </div>
  <div class="page" role="presentation">
    <div class="tip" role="presentation" style="padding: 12px;">
      "Click here to hide this tip."
      <button type="button">
        "More tips"
      </button>
    </div>
    <p>
      "Draft dismissed"
    </p>
  </div>
  <button type="button">
    "Save"
  </button>
  <button type="button">
    "Upload"
  </button>
  <button type="button">
    "Finish upload"
  </button>
  <ol aria-label="Log">
    <li>
      "page"
    </li>
    <li>
      "kept"
    </li>
    <li>
      "page"
    </li>
    <li>
      "dismissed"
    </li>
  </ol>
</section>
