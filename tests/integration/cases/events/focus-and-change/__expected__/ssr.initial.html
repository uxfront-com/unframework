<section aria-label="Profile" class="profile-fields">
  <div aria-label="Name fields" class="name-group" role="group">
    <label>
      "Name"
      <input name="name">
    </label>
  </div>
  <label>
    "Nickname"
    <input name="nickname">
  </label>
  <p>
    "Nickname:"
  </p>
  <label>
    <input name="public" type="checkbox">
    "Public profile"
  </label>
  <label>
    <input name="locked" type="checkbox">
    "Locked"
  </label>
  <div aria-label="Card" class="card" role="group" tabindex="-1">
    <p>
      "Card not focused"
    </p>
    <p>
      "Card blurs: 0"
    </p>
    <button type="button">
      "Inside the card"
    </button>
  </div>
  <ol aria-label="Log"></ol>
</section>
