<section aria-label="Quick actions" class="quick-actions">
  <label>
    "Search"
    <input name="query" uf:value="">
  </label>
  <p>
    "Query:"
  </p>
  <label>
    "Note"
    <input name="note" uf:value="ok">
  </label>
  <label>
    "Scope"
    <select name="scope">
      <option uf:selected="true" value="mine">
        "Mine"
      </option>
      <option uf:selected="false" value="team">
        "Team"
      </option>
    </select>
  </label>
  <ul aria-label="Actions">
    <li>
      <label>
        "Shortcut for Copy"
        <input name="Copy" uf:value="">
      </label>
      <button type="button">
        "Run Copy"
      </button>
    </li>
    <li>
      <label>
        "Shortcut for Paste"
        <input name="Paste" uf:focused="" uf:value="z">
      </label>
      <button type="button">
        "Run Paste"
      </button>
    </li>
  </ul>
  <p>
    "Last key: Paste: z"
  </p>
  <form aria-label="Subscribe" class="subscribe">
    <p>
      "Subscriptions: 0"
    </p>
    <button type="submit">
      "Subscribe"
    </button>
  </form>
</section>
