<section aria-label="Trip" class="city-picker">
  <form aria-label="Destination" role="search">
    <label>
      "City"
      <input aria-autocomplete="list" aria-expanded="false" name="city" role="combobox" type="search">
    </label>
    <button type="submit">
      "Search"
    </button>
  </form>
  <p role="status">
    "No city chosen"
  </p>
  <label>
    "Note"
    <textarea name="note"></textarea>
  </label>
  <ul aria-label="Notes"></ul>
</section>
