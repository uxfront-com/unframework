<main class="board">
  <button type="button">
    "Remove panel"
  </button>
  <section aria-label="Panel" class="panel">
    <button type="button">
      "Show note"
    </button>
    <button type="button" uf:focused="">
      "Add extra"
    </button>
    <button type="button">
      "Reverse rows"
    </button>
    <p class="note">
      "Note"
    </p>
    <span>
      "Extra 1"
    </span>
    <span>
      "Extra 2"
    </span>
    <ul>
      <li>
        "Alpha"
      </li>
      <li>
        "Beta"
      </li>
    </ul>
  </section>
</main>
<uf:teleported>
  <div class="first" data-teleported="true">
    "First"
  </div>
</uf:teleported>
<uf:teleported>
  <div class="second" data-teleported="true">
    "Second"
  </div>
</uf:teleported>
<uf:teleported>
  <p class="tip" data-teleported="true">
    "Alpha tip"
  </p>
</uf:teleported>
<uf:teleported>
  <p class="tip" data-teleported="true">
    "Beta tip"
  </p>
</uf:teleported>
