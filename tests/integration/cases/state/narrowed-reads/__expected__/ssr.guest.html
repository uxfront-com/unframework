<section aria-label="Invite" class="team-invite">
  <h2>
    "Invite as a guest"
  </h2>
  <ul aria-label="Members">
    <li>
      <button aria-pressed="false" type="button">
        "Grace"
      </button>
    </li>
  </ul>
  <div aria-label="Pages" class="pager" role="group">
    <span>
      "Page 1 of 1"
    </span>
  </div>
  <p role="status">
    "Nobody selected"
  </p>
  <button type="button">
    "Invite"
  </button>
  <button type="button">
    "Remove"
  </button>
  <form aria-label="Email invite">
    <label>
      "Email"
      <input name="email" type="email">
    </label>
    <button type="submit">
      "Send"
    </button>
  </form>
  <button type="button">
    "Tag as team"
  </button>
  <button type="button">
    "Use a link"
  </button>
  <div class="field">
    <input aria-label="Password" type="password">
  </div>
  <button type="button">
    "Start the clock"
  </button>
  <button type="button">
    "Stop the clock"
  </button>
  <p>
    "Seconds: 0"
  </p>
</section>
