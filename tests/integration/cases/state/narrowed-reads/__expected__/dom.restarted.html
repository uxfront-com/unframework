<section aria-label="Invite" class="team-invite">
  <h2>
    "Invite as Ada"
  </h2>
  <ul aria-label="Members">
    <li>
      <button aria-pressed="false" type="button">
        "Grace"
      </button>
    </li>
    <li>
      <button aria-pressed="false" type="button">
        "Alan"
      </button>
    </li>
  </ul>
  <div aria-label="Pages" class="pager" role="group">
    <span>
      "Page 1 of 2"
    </span>
    <button type="button">
      "Next"
    </button>
  </div>
  <p role="status">
    "Nobody selected"
  </p>
  <button type="button">
    "Invite"
  </button>
  <button type="button">
    "Remove"
  </button>
  <form aria-label="Email invite">
    <label>
      "Email"
      <input name="email" type="email" uf:value="">
    </label>
    <button type="submit">
      "Send"
    </button>
  </form>
  <button type="button">
    "Tag as team"
  </button>
  <button type="button">
    "Use a link"
  </button>
  <div class="field">
    <input aria-label="Password" type="password" uf:value="">
  </div>
  <button type="button" uf:focused="">
    "Start the clock"
  </button>
  <button type="button">
    "Stop the clock"
  </button>
  <p>
    "Seconds: 3"
  </p>
</section>
