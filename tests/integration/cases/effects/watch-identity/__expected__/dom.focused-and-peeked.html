<section aria-label="Books" class="book-shelf">
  <ul aria-label="Shelf">
    <li>
      <span>
        "Dune"
      </span>
      <button type="button">
        "Focus Dune"
      </button>
      <button type="button">
        "Peek Dune"
      </button>
      <button type="button">
        "Read Dune"
      </button>
    </li>
    <li>
      <span>
        "Emma"
      </span>
      <button type="button">
        "Focus Emma"
      </button>
      <button type="button" uf:focused="">
        "Peek Emma"
      </button>
      <button type="button">
        "Read Emma"
      </button>
    </li>
  </ul>
  <p>
    "Focused: Dune"
  </p>
  <p>
    "Books read: 0"
  </p>
  <button type="button">
    "Count again"
  </button>
  <button aria-expanded="false" type="button">
    "Details"
  </button>
  <button type="button">
    "Start"
  </button>
  <p role="status">
    "Idle: idle"
  </p>
  <button type="button">
    "Raise the limit"
  </button>
  <p>
    "Range: 1 to 5"
  </p>
</section>
