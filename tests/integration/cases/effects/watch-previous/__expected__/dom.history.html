<section aria-label="Zoom" class="zoom-control">
  <output>
    "100%"
  </output>
  <button type="button">
    "Zoom in"
  </button>
  <button type="button">
    "Zoom out"
  </button>
  <button type="button" uf:focused="">
    "Reset"
  </button>
  <ol aria-label="History">
    <li>
      "100% to 125%"
    </li>
    <li>
      "125% to 150%"
    </li>
    <li>
      "150% to 125%"
    </li>
    <li>
      "125% to 100%"
    </li>
  </ol>
</section>
