<section aria-label="Reading list" class="reading-list">
  <label>
    "Search"
    <input name="query" type="search" uf:value="">
  </label>
  <p role="status">
    "0 found"
  </p>
  <ul aria-label="Books"></ul>
  <div aria-label="Shelf" role="group">
    <button aria-pressed="true" type="button">
      "All"
    </button>
    <button aria-pressed="false" type="button">
      "Unread"
    </button>
  </div>
  <button aria-pressed="true" type="button" uf:focused="">
    "Check for new books"
  </button>
  <p>
    "Checks: 1"
  </p>
  <button type="button">
    "Refresh shelves"
  </button>
  <ul aria-label="Shelves">
    <li>
      "Fiction: not counted"
    </li>
    <li>
      "History: not counted"
    </li>
  </ul>
  <p>
    "Up to date"
  </p>
</section>
