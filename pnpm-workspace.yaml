packages:
  - "apps/*"
  - "packages/*"
  # The v1 compiler is kept for reference only (and gitignored). Its `catalog:`
  # dependencies name entries this workspace does not define, so including it
  # would break `pnpm install`.
  - "!packages/compiler-v1"
  - "tests/*"
  - "tests/toolchains/*"
  # `tests/*` reaches one level only, so the design system needs its own glob. Apps under
  # tests/e2e/apps stay out of the workspace, because they'll install from packed tarballs.
  - "tests/e2e"
  - "tests/e2e/design-system"
  - "!tests/e2e/apps/**"
allowBuilds:
  # Only an auto-installed peer of @nuxt/content: Docus reads content with the
  # built-in node:sqlite, so the native binding is never built.
  better-sqlite3: false
  esbuild: true
  # Its postinstall only switches the build to Vue 2; the default build is Vue 3's.
  vue-demi: false
  # Native optional dependencies of @angular/build, which ship prebuilt binaries.
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false
  # Astro's optional image service; the tests render no images through it.
  sharp: false
overrides:
  # 2.1.3 serializes `strong` and `emphasis` through containerPhrasing, which calls
  # remark-mdc's (3.11.1) wrappers of them again: any **bold** text in the docs
  # overflows the stack, and llms-full.txt fails to prerender. Drop this once
  # remark-mdc handles it.
  mdast-util-to-markdown: 2.1.2
  # @nuxtjs/partytown (2.0.0) asks for ^0.11.0, which reads deprecated APIs when
  # it mirrors the page for its worker: the attributionSrc of every element
  # (fixed in 0.14) and window.fence, which Chrome reports as FencedFrame
  # (fixed in 1.0.5). Each deprecation Chrome logs costs every page its Best
  # Practices 100. Drop this once @nuxtjs/partytown depends on 1.0.5.
  "@nuxtjs/partytown>@qwik.dev/partytown": 1.0.5
  # @typescript/typescript6 depends on `@typescript/old: npm:typescript@^6`. Pin the real
  # TypeScript 6, which Angular checks at runtime, so a lockfile refresh cannot move it.
  "@typescript/typescript6>@typescript/old": npm:typescript@6.0.3
packageExtensions:
  # Analog imports `typescript` without declaring it, so pnpm would resolve the root's
  # TypeScript 7, which has no JS API. As a peer, it shares the TypeScript 6 of its importer
  # (tests/toolchains/angular).
  "@analogjs/vite-plugin-angular@2":
    peerDependencies:
      typescript: ">=6.0 <6.1"
  # eslint-plugin-qwik imports `typescript` without declaring it, so pnpm would resolve the root's
  # TypeScript 7. As a peer, its type-aware rules share the TypeScript 6 of tests/toolchains/
  # qwik-eslint, the one typescript-eslint builds the program with (ADR-0042). The range is
  # typescript-eslint's. No version range: a range would not match the 2.0 prereleases.
  eslint-plugin-qwik:
    peerDependencies:
      typescript: ">=4.8.4 <6.1.0"
peerDependencyRules:
  allowedVersions:
    # Qwik 2.0.0-rc.5 declares an optional `vitest: ">=2 <5"` peer; the harness runs Vitest 5.
    "@qwik.dev/core>vitest": "5"
    # eslint-plugin-solid and eslint-plugin-qwik depend on @typescript-eslint/utils, which peers
    # TypeScript <6.1. The Solid and Qwik toolchains run them as oxlint JS plugins with their
    # type-aware rules off, so nothing calls TypeScript's API there (ADR-0042); Qwik's type-aware
    # rules run from tests/toolchains/qwik-eslint, on TypeScript 6. The entries name the catalog's
    # TypeScript 7 exactly, because a range such as "7" does not match a prerelease.
    "eslint-plugin-qwik>typescript": "7.1.0-beta"
    "@typescript-eslint/utils>typescript": "7.1.0-beta"
    "@typescript-eslint/typescript-estree>typescript": "7.1.0-beta"
    "@typescript-eslint/project-service>typescript": "7.1.0-beta"
    "@typescript-eslint/tsconfig-utils>typescript": "7.1.0-beta"
    "@typescript-eslint/type-utils>typescript": "7.1.0-beta"
    "ts-api-utils>typescript": "7.1.0-beta"
minimumReleaseAgeExclude:
  - "@uxfront/layer-docs@0.8.4"
  - "@uxfront/layer-ui@0.1.11"
  - "@uxfront/oxfmt-config@0.1.1"
  - "@uxfront/oxlint-config@0.1.1"
  - "@uxfront/scene@0.5.1"
  - "@uxfront/ui@0.9.1"
  - "@vitest/mocker@5.0.3"
  - "@vitest/spy@5.0.3"
  - vitest@5.0.3
  - "@angular/common@22.2.1"
  - "@angular/compiler-cli@22.2.1"
  - "@angular/compiler@22.2.1"
  - "@angular/core@22.2.1"
  - "@angular/platform-browser@22.2.1"
  - "@angular/platform-server@22.2.1"
  - "@vitest/browser-playwright@5.0.3"
  - "@vitest/browser@5.0.3"
  - "@vitest/pretty-format@5.0.3"
  - "@vitest/ui@5.0.3"
  - "@vitest/utils@5.0.3"
  # Solid 2.0.0 and its Vite plugin 3.0.0 were published on 2026-11-17, under pnpm's 24-hour
  # minimum release age (ADR-0102). The compiler's native builds are its optional dependencies.
  - "@solidjs/compiler@2.0.0"
  - "@solidjs/compiler-darwin-arm64@2.0.0"
  - "@solidjs/compiler-darwin-x64@2.0.0"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0"
  - "@solidjs/compiler-wasm32-wasi@2.0.0"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0"
  - "@solidjs/signals@2.0.0"
  - "@solidjs/vite-plugin@3.0.0"
  - "@solidjs/web@2.0.0"
  - solid-js@2.0.0
# The version baseline (plan, Appendix C). Every package takes its tooling from
# here, so one line moves a version for the whole repo. Compiler dependencies
# that shape the output (oxc, oxfmt) are exact: the same input and the same
# versions give byte-identical output (P8).
catalog:
  "@analogjs/vite-plugin-angular": 2.9.7
  "@angular-eslint/eslint-plugin": 22.8.0
  "@angular-eslint/eslint-plugin-template": 22.8.0
  "@angular-eslint/template-parser": 22.8.0
  "@angular/build": 22.3.0
  "@angular/cli": 22.3.0
  "@angular/common": 22.3.0
  "@angular/compiler": 22.3.0
  "@angular/compiler-cli": 22.3.0
  "@angular/core": 22.3.0
  "@angular/platform-browser": 22.3.0
  "@angular/platform-server": 22.3.0
  "@astrojs/check": 0.9.12
  "@astrojs/compiler-rs": 0.5.3
  "@babel/core": 7.29.7
  "@babel/preset-typescript": 7.29.7
  # The wasm runtime Astro's checker loads (`@astrojs/astro2tsx`), pinned in its toolchain: a peer
  # of `@napi-rs/wasm-runtime`, which pnpm would otherwise take from rolldown's wasm binding, a 2.0
  # beta the checker cannot run on.
  "@emnapi/core": 1.11.3
  "@emnapi/runtime": 1.11.3
  "@fontsource/inter": ^5.3.0
  "@jridgewell/gen-mapping": 0.3.13
  "@jridgewell/remapping": 2.3.5
