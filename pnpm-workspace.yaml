# Named catalogs, after the flat one, which tests/e2e/harness/apps.ts reads. `solid2` holds
# Solid 2 for the `solid2` target (ADR-0102): only target-solid2, tests/toolchains/solid2 and the
# solid2 e2e app take it, so no package installs both Solid majors.
catalogs:
  solid2:
    "@solidjs/compiler": 2.0.2
    "@solidjs/vite-plugin": 3.0.1
    "@solidjs/web": 2.0.2
    eslint-plugin-solid: 0.19.0
    solid-js: 2.0.0
patchedDependencies:
  # TypeScript 7.1 reports its self-referencing `Selector` type as infinitely circular
  # (TS5115, microsoft/TypeScript#64605), so codegen's scoper fails check-types. The patch writes
  # out the same nodes as a union. Drop it once TypeScript or the package fixes the type.
  postcss-selector-parser@7.1.6: patches/postcss-selector-parser@7.1.6.patch
