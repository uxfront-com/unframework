packages:
  - "apps/*"
  - "packages/*"
  # The v1 compiler is kept for reference only (and gitignored). Its `catalog:`
  # dependencies name entries this workspace does not define, so including it
  # would break `pnpm install`.
  - "!packages/compiler-v1"
  - "tests/*"
  - "tests/toolchains/*"
allowBuilds:
  # Only an auto-installed peer of @nuxt/content: Docus reads content with the
  # built-in node:sqlite, so the native binding is never built.
  better-sqlite3: false
  esbuild: true
  # Its postinstall only switches the build to Vue 2; the default build is Vue 3's.
  vue-demi: false
  # Native optional dependencies of @angular/build, which ship prebuilt binaries.
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false
  # Astro's optional image service; the tests render no images through it.
  sharp: false
overrides:
  # 2.1.3 serializes `strong` and `emphasis` through containerPhrasing, which calls
  # remark-mdc's (3.11.1) wrappers of them again: any **bold** text in the docs
  # overflows the stack, and llms-full.txt fails to prerender. Drop this once
  # remark-mdc handles it.
  mdast-util-to-markdown: 2.1.2
  # @nuxtjs/partytown (2.0.0) asks for ^0.11.0, which reads the deprecated
  # attributionSrc of every element when it mirrors the page for its worker:
  # Chrome logs a deprecation, and the homepage loses its Best Practices 100.
  # 0.14 skips it. Drop this once @nuxtjs/partytown depends on 0.14.
  "@nuxtjs/partytown>@qwik.dev/partytown": 0.14.4
  # @typescript/typescript6 depends on `@typescript/old: npm:typescript@^6`. Pin the real
  # TypeScript 6, which Angular checks at runtime, so a lockfile refresh cannot move it.
  "@typescript/typescript6>@typescript/old": npm:typescript@6.0.3
packageExtensions:
  # Analog imports `typescript` without declaring it, so pnpm would resolve the root's
  # TypeScript 7, which has no JS API. As a peer, it shares the TypeScript 6 of its importer
  # (tests/toolchains/angular).
  "@analogjs/vite-plugin-angular@2":
    peerDependencies:
      typescript: ">=6.0 <6.1"
peerDependencyRules:
  allowedVersions:
    # Qwik 2.0.0-beta.47 declares an optional `vitest: ">=2 <5"` peer; the harness runs Vitest 5.
    "@qwik.dev/core>vitest": "5"
    # The compiler pins oxfmt 0.71 (plan, Appendix C); the shared config still names ^0.70.
    "@uxfront/oxfmt-config>oxfmt": "0.71"
minimumReleaseAgeExclude:
  - "@uxfront/layer-ui@0.1.4"
  - "@uxfront/scene@0.2.0"
  - "@uxfront/ui@0.4.1"
  - "@vitest/mocker@5.0.3"
  - "@vitest/spy@5.0.3"
  - vitest@5.0.3
  - "@angular/common@22.2.1"
  - "@angular/compiler-cli@22.2.1"
  - "@angular/compiler@22.2.1"
  - "@angular/core@22.2.1"
  - "@angular/platform-browser@22.2.1"
  - "@angular/platform-server@22.2.1"
  - "@qwik.dev/core@2.0.0-beta.47"
  - "@vitest/browser-playwright@5.0.3"
  - "@vitest/browser@5.0.3"
  - "@vitest/pretty-format@5.0.3"
  - "@vitest/ui@5.0.3"
  - "@vitest/utils@5.0.3"
# The version baseline (plan, Appendix C). Every package takes its tooling from
# here, so one line moves a version for the whole repo. Compiler dependencies
# that shape the output (oxc, oxfmt) are exact: the same input and the same
# versions give byte-identical output (P8).
