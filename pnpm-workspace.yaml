  "@styleframe/runtime": 3.2.2
  "@styleframe/theme": 3.10.0
  "@sveltejs/package": 3.0.3
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@types/babel__core": ^7.20.5
  "@types/node": ^24.19.0
  "@types/pngjs": ^6.0.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@typescript-eslint/scope-manager": 8.73.0
  "@uxfront/typescript-config": ^0.1.0
  "@vitejs/plugin-react": 6.3.0
  "@vitejs/plugin-vue": 6.0.11
  "@vitest/browser-playwright": 5.1.1
  ajv: ^8.20.0
  astro: 7.4.13
