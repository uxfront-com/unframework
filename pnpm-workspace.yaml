  axe-core: 4.14.1
  babel-plugin-react-compiler: 1.0.0
  babel-preset-solid: 1.9.19
  csstype: ^3.2.4
  eslint: 10.15.0
  eslint-plugin-astro: 3.2.1
  eslint-plugin-qwik: 2.0.0-rc.5
  eslint-plugin-solid: 0.20.0
  eslint-plugin-svelte: 3.24.1
  eslint-plugin-vue: 10.12.1
  lightningcss: 1.33.0
  magic-string: ^1.4.5
  ng-packagr: 22.3.0
  oxc-codegen: 0.159.0
  oxc-parser: 0.159.0
  oxc-resolver: 11.24.2
  oxfmt: 0.79.0
  oxlint: 1.94.0
  oxlint-tsgolint: 7.0.2007
  parse5: ^8.1.1
