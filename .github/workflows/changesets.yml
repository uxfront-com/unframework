# The npm trusted publisher for every package published from this repo names
# this file by its exact filename. Renaming or moving changesets.yml revokes the publish
# credential, and the release then fails with a misleading E404.
#
# The release itself runs in the shared workflow in uxfront-com/.github, pinned
# by commit SHA. On a push to main:
#   - pending changesets -> open/update the "Version Packages" PR, publish nothing
#   - no changesets and unpublished versions -> pack, publish, tag, release
#   - otherwise -> do nothing
#
# The shared workflow splits the release into jobs so `id-token: write` exists
# only on the job that talks to npm.
name: Changesets

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release mid-flight.
concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # A called workflow can only lower these. npm needs `id-token: write` here
    # too, and the shared workflow passes it on only to its publish job.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: uxfront-com/.github/.github/workflows/release.yml@18a1d7cb1576c8053a80f3d166cfefecd470f5b3 # main
    with:
      build: pnpm turbo run build --filter='./packages/*'
