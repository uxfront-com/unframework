name: Setup
description: Sets up pnpm and Node.js, restores the pnpm store and installs the dependencies.

# Every job that installs calls this right after its checkout, which must come first, since a
# local action is read from the checkout. tests/repo/test/ci-setup.test.ts fails when a job in
# ci.yml or nightly.yml installs or caches on its own.
inputs:
  node-version:
    description: The Node.js version, the workflow's NODE_VERSION.
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    # The dependency cache, with a fallback. setup-node's pnpm cache restores only the exact
    # lockfile key, and a PR whose lockfile differs from main's, like a part on an integration
    # branch, finds no such key in a scope it can read, so it downloaded every package. The
    # restore key falls back to the newest store, and pnpm downloads only the difference.
    # `pnpm install` never removes a package from the store, so a restored store keeps older
    # lockfiles' packages. The ISO week in the key limits that: a fallback reaches only a store
    # from the same week, and each week starts from a cold install. A store prune can't do it,
    # since it deletes the packages pnpm copies rather than links, like esbuild.
    - name: Restore the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: node-cache-Linux-x64-pnpm-${{ steps.pnpm-store.outputs.week }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: node-cache-Linux-x64-pnpm-${{ steps.pnpm-store.outputs.week }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
