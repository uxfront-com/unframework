name: Feature request
description: Propose an idea for the compiler, or a framework it should speak.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Unframework. Please [search the existing issues](https://github.com/uxfront-com/unframework/issues?q=is%3Aissue) first. The compiler isn't published yet, so ideas now shape what it does first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Unframework would it change?
      options:
        - The component source
        - The compiler
        - A framework's output
        - A new framework to compile to
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: frameworks
    attributes:
      label: Frameworks
      description: Which frameworks would it affect?
      multiple: true
      options:
        - React
        - Vue
        - Svelte
        - Angular
        - Solid
        - Qwik
        - Astro
        - Another framework
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What Unframework should do, described the way you'd like to use it.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What's hard, or impossible, without it?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: A component as you'd write it, and the code you'd expect for each framework. Code, screenshots and links all work.
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Compilers, libraries or specs that already do something like it.
